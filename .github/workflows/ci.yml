name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (core + dev)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: python -m pytest -q
      # Golden gate: G-ref + one G-sim case per group (subset ci-fast), then the 10 mutants
      # planted in the engine must each fail it (M10). Every case runs nightly
      # (golden-nightly.yml).
      - name: Golden gate (G-ref + G-sim ci-fast)
        run: python -m abkit golden --subset ci-fast --strict
      - name: Golden gate mutants (M10)
        run: python -m abkit gate
