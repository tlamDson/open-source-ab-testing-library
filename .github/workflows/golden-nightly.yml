name: Golden Nightly

# Every golden case (G-ref, G-public, all G-sim) and the 10 planted mutants against the
# full dataset (M10). The required job `Lint + Test` (ci.yml) runs only the ci-fast subset.
# Not a required check. GitHub runs `schedule` only from the default branch.
on:
  schedule:
    - cron: "30 19 * * *" # 02:30 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-nightly
  cancel-in-progress: true

jobs:
  golden-full:
    name: Golden Full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (core + dev)
        run: python -m pip install -e ".[dev]"
      - name: Golden, every case
        run: python -m abkit golden --strict
      - name: Golden gate mutants, every case (M10)
        run: python -m abkit gate --full
